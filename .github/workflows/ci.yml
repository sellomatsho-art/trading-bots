name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # The suite is fully offline -- the HTTP layer is faked at the
        # requests.Session boundary -- so this needs no network and no secrets.
        run: python -m pytest -q

  no-key-handling:
    # Split out from `test` so the guard is a named, required-able check of its
    # own. This is the test that backs the claim that the bot cannot touch
    # funds; it should be impossible to merge past it without noticing.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert the package cannot sign, trade, or read secrets
        run: python -m pytest tests/test_no_key_handling.py -q
